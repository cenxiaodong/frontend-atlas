<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= title %></title>
    <style>
      /* 开屏页：应用 JS 未加载时先由这里内联渲染，挂载后由 SplashScreen 组件控制淡出移除 */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #eef0fe 0%, #f8f9ff 55%, #e2e7ff 100%);
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }

      #app-splash.splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        user-select: none;
      }

      .splash-logo {
        width: 104px;
        height: 104px;
        border-radius: 24px;
        object-fit: cover;
        box-shadow:
          0 12px 32px rgba(99, 102, 241, 0.22),
          0 2px 8px rgba(99, 102, 241, 0.12);
        animation: splash-pop 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-loading {
        display: flex;
        gap: 10px;
        margin-top: 32px;
      }

      .splash-loading i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6366f1;
        opacity: 0.4;
        animation: splash-bounce 1s ease-in-out infinite;
      }

      .splash-loading i:nth-child(2) {
        animation-delay: 0.15s;
      }

      .splash-loading i:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes splash-pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes splash-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-10px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- <div id="app-splash">
      <div class="splash-inner">
        <img class="splash-logo" src="/logo.png" alt="Frontend-Atlas" />
        <div class="splash-loading"><i></i><i></i><i></i></div>
      </div>
    </div> -->
    <!-- 主题预热：Vue 挂载前先按 localStorage 里的设置上底色，避免暗色模式刷新时闪一下浅色 -->
    <script>
      (() => {
        try {
          const state = JSON.parse(localStorage.getItem('atlas-global') || '');
          if (!state || !state.isDark) return;
          const html = document.documentElement;
          html.classList.add('dark');
          html.style.background = '#0a0a0a';
        } catch {
          /* localStorage 不可用或数据损坏时静默跳过，交给 App.vue 的 initTheme 处理 */
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
